databases:
  - name: sss-db
    databaseName: sss_db
    user: sss_user
    plan: free

services:
  # ---- Backend Web Service ----
  - type: web
    name: sss-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask --app run.py db upgrade && waitress-serve --host=0.0.0.0 --port=$PORT run:app"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_DAYS
        value: "14"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DATABASE_URL
        fromDatabase:
          name: sss-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # ---- Frontend Static Site ----
  - type: web
    name: sss-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: sss-backend
          type: web
          property: host
